name: zuri
description: Discover the best places around you — Rwanda's premier hyper-local discovery app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.0.0

  # Auth
  google_sign_in: ^6.2.1

  # Payment
  flutterwave_standard: ^1.0.12

  # Media
  image_picker: ^1.1.2

  # UI / Animations
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  flutter_staggered_animations: ^1.1.1
  flutter_svg: ^2.0.10+1

  # Maps
  google_maps_flutter: ^2.5.3

  # Location
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Environment / Config
  flutter_dotenv: ^5.1.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
